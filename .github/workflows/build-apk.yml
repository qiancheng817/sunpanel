name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install JS deps
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Create Android platform
        run: npx cap add android

      - name: Sync
        run: npx cap sync android

      - name: Replace launcher icons (预生成资源，含自适应图标)
        run: |
          set -e
          R=android/app/src/main/res
          rm -rf $R/mipmap-*
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp -r assets/android-res/mipmap-$d $R/
          done
          cp -r assets/android-res/mipmap-anydpi-v26 $R/
          cp -f assets/android-res/values/ic_launcher_background.xml $R/values/
          rm -f $R/drawable/ic_launcher_foreground.xml
          test -f $R/mipmap-xxxhdpi/ic_launcher.png && test -f $R/mipmap-xxxhdpi/ic_launcher_foreground.png && echo "icons ok"

      - name: Bump minSdkVersion to 26 (inappbrowser 插件要求)
        run: |
          python3 - <<'EOF'
          import re
          p = 'android/variables.gradle'
          s = open(p, encoding='utf-8').read()
          assert 'minSdkVersion' in s, 'minSdkVersion not found in ' + p
          # 不管当前生成的是 22 还是 23，统一设为 26（osinappbrowser 库要求 >= 26）
          s = re.sub(r'minSdkVersion\s*=\s*\d+', 'minSdkVersion = 26', s)
          open(p, 'w', encoding='utf-8').write(s)
          print('minSdk lines:', [l.strip() for l in s.splitlines() if 'minSdk' in l])
          EOF

      - name: Allow cleartext traffic (内网 http 地址需要)
        run: |
          python3 - <<'EOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          assert '<application' in s, 'application tag not found'
          if 'usesCleartextTraffic' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
              open(p, 'w', encoding='utf-8').write(s)
          print([l.strip() for l in s.splitlines() if 'usesCleartextTraffic' in l])
          EOF

      - name: Bump version to 1.3.2 (内网图标修复)
        run: |
          python3 - <<'EOF'
          import re
          p = 'android/app/build.gradle'
          s = open(p, encoding='utf-8').read()
          s = re.sub(r'versionName\s+"[^"]*"', 'versionName "1.3.2"', s)
          s = re.sub(r'versionCode\s+\d+', 'versionCode 6', s)
          open(p, 'w', encoding='utf-8').write(s)
          print([l.strip() for l in s.splitlines() if 'versionName' in l or 'versionCode' in l])
          EOF

      - name: Gradle memory settings
        run: |
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/sunpanel-mobile.apk
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: sunpanel-mobile-apk
          path: out/sunpanel-mobile.apk

      - name: Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.3.2' }}
          name: Sunpanel 安卓客户端 v1.3.2
          body: |
            自动构建产物，Sunpanel 移动端 APK（debug 签名，自用未上架）。

            使用：安装后打开 → 填面板地址（外网 https 域名 / 内网 http 地址）+ 账号密码 → 登录即可。
            点击卡片在应用内打开各 Docker 服务；长按卡片可切换内外网地址或用系统浏览器打开。

            v1.3.2 更新：
            - 修复内网环境下卡片图标不显示的问题：图标改走原生网络请求（带登录 token）转 base64 显示，
              不再受 WebView 混合内容/明文限制；内网时指向外网域名的图标地址自动改写为内网地址。
            - 图标加载中或失败时显示服务名首字母兜底。

            v1.3.1 更新：
            - 缩小不再受限于 100%：双指捏合最小可缩到约 30%。
            - 导航工具条移到屏幕底部并做窄（34dp）。

            v1.3.0 更新：
            - 自研原生应用内 WebView：完全在 App 内打开，支持双指捏合缩放，无外部兜底。

            保留功能：
            - 内外网地址自动切换（回前台自动重新探测）
            - 主面板记住密码、各服务密码保险箱、隐藏「导航」分组标题
            - 长按卡片仍可用系统浏览器打开（共享 Chrome 登录态）
          files: out/sunpanel-mobile.apk
