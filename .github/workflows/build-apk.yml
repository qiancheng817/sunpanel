name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install JS deps
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Create Android platform
        run: npx cap add android

      - name: Sync
        run: npx cap sync android

      - name: Replace launcher icons (预生成资源，含自适应图标)
        run: |
          set -e
          R=android/app/src/main/res
          rm -rf $R/mipmap-*
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp -r assets/android-res/mipmap-$d $R/
          done
          cp -r assets/android-res/mipmap-anydpi-v26 $R/
          cp -f assets/android-res/values/ic_launcher_background.xml $R/values/
          rm -f $R/drawable/ic_launcher_foreground.xml
          test -f $R/mipmap-xxxhdpi/ic_launcher.png && test -f $R/mipmap-xxxhdpi/ic_launcher_foreground.png && echo "icons ok"

      - name: Bump minSdkVersion to 26 (inappbrowser 插件要求)
        run: |
          python3 - <<'EOF'
          import re
          p = 'android/variables.gradle'
          s = open(p, encoding='utf-8').read()
          assert 'minSdkVersion' in s, 'minSdkVersion not found in ' + p
          # 不管当前生成的是 22 还是 23，统一设为 26（osinappbrowser 库要求 >= 26）
          s = re.sub(r'minSdkVersion\s*=\s*\d+', 'minSdkVersion = 26', s)
          open(p, 'w', encoding='utf-8').write(s)
          print('minSdk lines:', [l.strip() for l in s.splitlines() if 'minSdk' in l])
          EOF

      - name: Allow cleartext traffic (内网 http 地址需要)
        run: |
          python3 - <<'EOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          assert '<application' in s, 'application tag not found'
          if 'usesCleartextTraffic' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
              open(p, 'w', encoding='utf-8').write(s)
          print([l for l in s.splitlines() if 'usesCleartextTraffic' in l])
          EOF

      - name: Gradle memory settings
        run: |
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/sunpanel-mobile.apk
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: sunpanel-mobile-apk
          path: out/sunpanel-mobile.apk

      - name: Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          name: Sunpanel 安卓客户端 v1.0.0
          body: |
            自动构建产物，Sunpanel 移动端 APK（debug 签名，自用未上架）。

            使用：安装后打开 → 填面板地址（外网 https 域名 / 内网 http 地址）+ 账号密码 → 登录即可。
            点击卡片在应用内 WebView 打开各 Docker 服务；长按卡片可切换内外网地址或用系统浏览器打开。
          files: out/sunpanel-mobile.apk
